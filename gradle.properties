# Existing settings remain unchanged
kotlin.daemon.jvm.options=-Xmx1024m -XX:+UseParallelGC
kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true

# Disable script compilation avoidance
org.gradle.kotlin.dsl.scriptCompilationAvoidance=false

# Reduce Gradle memory requirements
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Keep existing settings
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.caching=true