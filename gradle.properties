# gradle.properties

# Versions
gdxVersion=1.12.1
kotlinVersion=1.9.21
coroutinesVersion=1.6.4
ktorVersion=2.3.4
lwjglVersion=3.3.2

# Gradle JVM options (adjust as needed)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Enable Gradle caching
org.gradle.caching=true

# Optional: Enable Kotlin incremental compilation for native (if applicable)
kotlin.incremental.native=true